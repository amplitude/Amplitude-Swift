name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: macos-15-large
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - name: Set Xcode 26.0
        run: |
          sudo xcode-select -switch /Applications/Xcode_26.0.app
      - name: Lint
        run: swiftlint --strict # force to fix warnings too
